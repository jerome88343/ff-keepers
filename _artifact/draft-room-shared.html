<style id="css">
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
:root{--bg:#0d0f13;--panel:#151a21;--panel2:#12161c;--line:#232a35;--line2:#1c222b;
 --tx:#e8ecf2;--dim:#8b97a8;--dim2:#5d6878;--a:#22d3ee;--b:#c084fc;--g:#34d399;--r:#f87171;--w:#fbbf24}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;
 padding:10px calc(12px + env(safe-area-inset-right)) calc(34px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
 touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.wrap{max-width:1720px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
h1{font-family:'Barlow Condensed',Impact,sans-serif;font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--dim);font:inherit;font-size:13px;font-weight:700;padding:8px 13px;border-radius:8px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--a);color:var(--tx)} .btn:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.btn.danger:hover{border-color:var(--r);color:var(--r)}
.spacer{margin-left:auto}
.live{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim2)}
.live.on .dot{background:var(--g);box-shadow:0 0 0 3px #34d39926}
.live.on{color:var(--g)} .live.ro .dot{background:var(--w)} .live.ro{color:var(--w)}
#search{background:var(--panel2);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:16px;font-weight:600;padding:10px 13px;border-radius:9px;width:340px;max-width:100%}
#search:focus{outline:none;border-color:var(--a)}
.sugg{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--a);border-radius:9px;margin-top:4px;min-width:340px;box-shadow:0 12px 34px #000a}
.sugg div{padding:11px 13px;cursor:pointer;font-size:14px;font-weight:700;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center;min-height:46px}
.sugg div:first-child{border-top:none} .sugg div.sel{background:#0d1f24}
.sugg .e{margin-left:auto;color:var(--dim2);font-size:12px;font-weight:700}
.clock{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#0d1f24;border:1px solid #1c4b56;border-radius:12px;padding:12px 18px;margin-bottom:10px;position:sticky;top:4px;z-index:40}
.clock.mine{background:#1a1410;border-color:var(--w)}
.clock .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800}
.clock .v{font-family:'Barlow Condensed',Impact,sans-serif;font-size:26px;line-height:1.05;color:var(--tx);font-variant-numeric:tabular-nums}
.clock .v em{color:var(--a);font-style:normal} .clock.mine .v em{color:var(--w)}
.clock .cell{display:flex;flex-direction:column;gap:1px}
.tabs{display:none;gap:6px;overflow-x:auto;padding:2px 0 8px;position:sticky;top:78px;z-index:39;background:var(--bg)}
.tabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);font:inherit;font-size:13px;font-weight:800;padding:10px 15px;border-radius:9px;min-height:44px;cursor:pointer;letter-spacing:.04em}
.tabs button.on{background:#0d1f24;border-color:var(--a);color:var(--a)}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 280px;gap:10px;align-items:start}
.pp{font-size:8.5px;font-weight:800;letter-spacing:.06em;padding:2px 5px;border-radius:4px;flex-shrink:0;min-width:26px;text-align:center}
.pp.RB{background:#2a1520;color:#f9a8d4}.pp.WR{background:#12203a;color:#93c5fd}.pp.TE{background:#0d2420;color:#6ee7b7}
.mix{display:flex;gap:10px;font-size:11.5px;font-weight:800;letter-spacing:.03em;align-items:center;flex-wrap:wrap}
.mix b{font-variant-numeric:tabular-nums;font-size:13px}
@media(max-width:1640px){.cols{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:1100px){.tabs{display:flex}.side{display:contents}.pane{display:none}.pane.on{display:block}.cols{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.ch .nm{font-family:'Barlow Condensed',Impact,sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.ch .ct{margin-left:auto;font-size:11px;font-weight:800;color:var(--dim2)}
.warn{padding:8px 12px;font-size:11.5px;font-weight:800;line-height:1.45;border-bottom:1px solid var(--line2)}
.warn.hot{background:#2a1215;color:#fca5a5;box-shadow:inset 3px 0 0 var(--r)}
.warn.mid{background:#1c1710;color:var(--w);box-shadow:inset 3px 0 0 var(--w)}
.warn.ok{background:#0d1f18;color:var(--g)}
ul{list-style:none}
li{display:flex;align-items:center;gap:7px;padding:7px 11px;border-top:1px solid var(--line2);cursor:pointer;font-size:13px}
li:first-child{border-top:none} li:hover{background:#0d1f24} li:active{background:#0d2b33}
li .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .tm{font-size:10.5px;font-weight:700;color:var(--dim2);flex-shrink:0}
li .e{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--dim2);font-variant-numeric:tabular-nums;flex-shrink:0}
.rk{font-size:8.5px;font-weight:800;letter-spacing:.05em;padding:1px 4px;border-radius:3px;flex-shrink:0}
.rk.r26{color:var(--w);background:#2a2110} .rk.r25{color:var(--b);background:#231a38}
.cliff{padding:4px 11px;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--r);background:#1a1013;border-top:1px solid #3a1c22;border-bottom:1px solid #3a1c22}
.side{display:flex;flex-direction:column;gap:10px}
.trow{padding:8px 11px;border-top:1px solid var(--line2);cursor:pointer;font-size:12.5px;font-weight:700;display:flex;gap:7px;align-items:center}
.trow:hover{background:#0d1f24} .trow.on{background:#0d1f24;box-shadow:inset 3px 0 0 var(--a)} .trow.me{color:var(--w)}
.trow .need{margin-left:auto;font-size:10px;font-weight:800;color:var(--dim2);letter-spacing:.04em}
.rost{padding:9px 11px;font-size:12px}
.rost .g{margin-bottom:7px}
.rost .gl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:800}
.rost .p{font-size:12.5px;font-weight:700;padding:2px 0;display:flex;gap:6px}
.rost .p .kk{font-size:9px;font-weight:800;color:var(--g);letter-spacing:.05em}
.rost .p .rr{margin-left:auto;color:var(--dim2);font-size:11px}
.rost .empty{color:var(--r);font-size:11.5px;font-weight:800}
.log{font-size:12px} .log div{padding:6px 11px;border-top:1px solid var(--line2);display:flex;gap:7px}
.log .o{color:var(--dim2);font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0}
.log .t{color:var(--dim2);margin-left:auto;font-size:10.5px;font-weight:700;flex-shrink:0}
.log div.me{background:#1a1410}
.hint{font-size:11.5px;color:var(--dim2);font-weight:600;line-height:1.6;padding:10px 2px 0}
.banner{background:#1c1710;border:1px solid #4a3a15;color:var(--w);border-radius:10px;padding:10px 14px;margin-bottom:9px;font-size:12.5px;font-weight:700;line-height:1.5}
@media(hover:none){li{padding:11px 12px;font-size:14.5px;min-height:46px}li .n{font-size:14.5px}
 .trow{padding:12px;font-size:13.5px;min-height:46px}li:hover,.trow:hover{background:inherit}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script id="state" type="application/json">{"picks": []}</script>
<script id="app" type="text/plain">
const D=DRAFT_DATA, ME=D.me;
const TEAM={}; D.teams.forEach(t=>TEAM[t.id]=t);
const P={}; D.pool.forEach(p=>P[p.n]=p);
const IDX={}; D.pool.forEach((p,i)=>IDX[p.n]=i);
const LIVE=D.draft.filter(s=>!s.keeper);
let picks=(STATE.picks||[]).map(i=>D.pool[i]).filter(Boolean).map(p=>p.n);
let AR=null, canWrite=null, busy=false, pane='FLEX', viewing=ME;

const taken=()=>new Set(picks);
const cur=()=>LIVE[picks.length]||null;
const avail=pos=>{const t=taken();return D.pool.filter(p=>p.p===pos&&!t.has(p.n))};
function seatOf(i){return LIVE[i]}
function onClock(){const c=cur();return c&&c.tid===ME}
function untilMe(){const from=picks.length+(onClock()?1:0);
  const i=LIVE.findIndex((s,ix)=>ix>=from&&s.tid===ME);return i<0?null:i-picks.length}
function rate(pos,win){const last=picks.slice(-win);if(!last.length)return null;
  return last.filter(n=>P[n]&&P[n].p===pos).length/last.length}
function tierBreak(list){let bi=-1,bg=0;
  for(let i=0;i<Math.min(list.length-1,11);i++){const g=list[i+1].r-list[i].r;if(g>bg){bg=g;bi=i}}
  return bg>=12?bi:-1}
function rosterOf(tid){const t=TEAM[tid],out={QB:[],RB:[],WR:[],TE:[],K:[],DST:[]};
  t.k.forEach(k=>out[k.p]&&out[k.p].push({n:k.n,r:'R'+k.r,keep:true}));
  picks.forEach((n,i)=>{const s=seatOf(i);if(s&&s.tid===tid){const pl=P[n];if(pl&&out[pl.p])out[pl.p].push({n:n,r:'R'+s.r,keep:false})}});
  return out}
function needs(tid){const r=rosterOf(tid),n=[];
  if(r.QB.length<1)n.push('QB');if(r.RB.length<3)n.push('RB');if(r.WR.length<3)n.push('WR');if(r.TE.length<1)n.push('TE');return n}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function flexCol(){
  const t=taken();
  const list=D.pool.filter(p=>(p.p==='RB'||p.p==='WR'||p.p==='TE')&&!t.has(p.n));
  const top=list.slice(0,12), c={RB:0,WR:0,TE:0}; top.forEach(p=>c[p.p]++);
  const tb=tierBreak(list);
  let h=`<div class="ch"><span class="nm">Flex</span><span class="ct">${list.length} left</span></div>`;
  h+=`<div class="warn ok"><div class="mix"><span style="color:var(--dim)">Next 12</span><span style="color:#f9a8d4">RB <b>${c.RB}</b></span><span style="color:#93c5fd">WR <b>${c.WR}</b></span><span style="color:#6ee7b7">TE <b>${c.TE}</b></span></div></div><ul>`;
  list.slice(0,30).forEach((p,i)=>{
    if(i===tb+1&&tb>=0)h+='<div class="cliff">tier drop</div>';
    const rk=p.rk===26?'<span class="rk r26">RK</span>':p.rk===25?'<span class="rk r25">2YR</span>':'';
    h+=`<li data-n="${esc(p.n)}"><span class="pp ${p.p}">${p.p}</span><span class="n">${esc(p.n)}</span>${rk}<span class="tm">${p.t}</span><span class="e">${p.r}</span></li>`});
  return h+'</ul>'}

function posCol(pos){
  const list=avail(pos),u=untilMe(),r=rate(pos,10),rAll=rate(pos,999);
  const use=r===null?null:(r*0.65+(rAll||0)*0.35);
  const exp=(u===null||use===null)?null:Math.round(u*use);
  const tb=tierBreak(list),inTier=tb<0?list.length:tb+1,up=onClock();
  let w='',cls='ok';
  if(exp!==null&&u!==null){
    const lead=up?`If you pass now, about ${exp}`:`About ${exp}`, tail=up?'before you pick again':'before your next pick';
    if(tb>=0&&exp>=inTier){cls='hot';w=`${up?'TAKE ONE NOW. ':'RUN RISK. '}${lead} ${pos}s go ${tail} and only ${inTier} sit above the cliff.`}
    else if(tb>=0&&exp>=inTier-2){cls='mid';w=`Tight. ${lead} ${pos}s go ${tail}, ${inTier} left in this tier.`}
    else w=`${lead} ${pos}s go ${tail}. ${inTier} in the top tier.`;
  } else w=`${list.length} available.`;
  let h=`<div class="ch"><span class="nm">${pos}</span><span class="ct">${list.length} left</span></div><div class="warn ${cls}">${w}</div><ul>`;
  list.slice(0,26).forEach((p,i)=>{
    if(i===tb+1&&tb>=0)h+='<div class="cliff">tier drop</div>';
    const rk=p.rk===26?'<span class="rk r26">RK</span>':p.rk===25?'<span class="rk r25">2YR</span>':'';
    h+=`<li data-n="${esc(p.n)}"><span class="n">${esc(p.n)}</span>${rk}<span class="tm">${p.t}</span><span class="e">${p.r}</span></li>`});
  return h+'</ul>'}

function render(){
  const c=cur(),root=document.getElementById('root');
  const ro=canWrite===false;
  let h='<div class="wrap">';
  h+=`<div class="top"><h1>Draft Room</h1>
    <div style="position:relative"><input id="search" placeholder="Type a player, Enter to log the pick" autocomplete="off" ${ro?'disabled':''}><div id="sugg" class="sugg" hidden></div></div>
    <span class="spacer"></span>
    <span class="live ${canWrite===true?'on':ro?'ro':''}"><span class="dot"></span>${canWrite===true?(busy?'Saving':'Shared live'):ro?'View only':'Connecting'}</span>
    ${ro?'':'<button class="btn" id="undo">Undo</button><button class="btn danger" id="reset">Reset</button>'}</div>`;
  if(ro)h+='<div class="banner">You are viewing this board, not editing it. Whoever is entering picks will update it and your screen refreshes on its own. Ask Jeremy for edit access if you need to log picks.</div>';
  if(!c)h+='<div class="clock"><div class="cell"><div class="k">Draft complete</div><div class="v">All 144 picks are in.</div></div></div>';
  else{const u=untilMe(),mine=c.tid===ME;
    h+=`<div class="clock${mine?' mine':''}">
      <div class="cell"><div class="k">On the clock</div><div class="v"><em>${esc(TEAM[c.tid].name)}</em></div></div>
      <div class="cell"><div class="k">Pick</div><div class="v">#${c.ovr} &middot; R${c.r}</div></div>
      <div class="cell"><div class="k">Made</div><div class="v">${picks.length} / 144</div></div>
      <div class="cell"><div class="k">Jeremy picks</div><div class="v">${mine?'<em>UP NOW</em>':(u===null?'done':'in '+u)}</div></div>
      <div class="cell"><div class="k">They still need</div><div class="v" style="font-size:19px">${needs(c.tid).join(' ')||'nothing'}</div></div></div>`}
  h+=`<div class="tabs" id="tabs">${['FLEX','RB','WR','TE','QB','OTHER','TEAMS','LOG'].map(p=>`<button data-p="${p}" class="${pane===p?'on':''}">${p==='OTHER'?'K / DST':p==='TEAMS'?'Teams':p==='LOG'?'Log':p==='FLEX'?'Flex':p}</button>`).join('')}</div><div class="cols">`;
  h+=`<div class="col pane ${pane==='FLEX'?'on':''}" data-pane="FLEX">${flexCol()}</div>`;
  ['RB','WR','TE','QB'].forEach(p=>h+=`<div class="col pane ${pane===p?'on':''}" data-pane="${p}">${posCol(p)}</div>`);
  h+='<div class="side">';
  h+=`<div class="col pane ${pane==='TEAMS'?'on':''}" data-pane="TEAMS"><div class="ch"><span class="nm">Teams</span><span class="ct">tap to view</span></div>`+
     D.teams.slice().sort((a,b)=>a.slot-b.slot).map(t=>`<div class="trow ${viewing===t.id?'on':''} ${t.id===ME?'me':''}" data-t="${t.id}">${t.slot}. ${esc(t.name)}<span class="need">${needs(t.id).join(' ')||'set'}</span></div>`).join('')+'</div>';
  const r=rosterOf(viewing);
  h+=`<div class="col pane ${pane==='TEAMS'?'on':''}" data-pane="TEAMS"><div class="ch"><span class="nm">${esc(TEAM[viewing].owner)}</span></div><div class="rost">`+
     ['QB','RB','WR','TE','K','DST'].map(pos=>{const l=r[pos];
       if(!l.length)return `<div class="g"><div class="gl">${pos}</div><div class="empty">none</div></div>`;
       return `<div class="g"><div class="gl">${pos}</div>`+l.map(x=>`<div class="p">${esc(x.n)}${x.keep?'<span class="kk">K</span>':''}<span class="rr">${x.r}</span></div>`).join('')+'</div>'}).join('')+'</div></div>';
  h+=`<div class="col pane ${pane==='LOG'?'on':''}" data-pane="LOG"><div class="ch"><span class="nm">Pick Log</span></div><div class="log">`+
     (picks.slice().reverse().slice(0,14).map((n,i)=>{const s=seatOf(picks.length-1-i);
       return `<div class="${s&&s.tid===ME?'me':''}"><span class="o">#${s?s.ovr:''}</span>${esc(n)}<span class="t">${s?esc(TEAM[s.tid].name.slice(0,16)):''}</span></div>`}).join('')||'<div class="hint">No picks logged yet.</div>')+'</div></div>';
  const t=taken();
  h+=`<div class="col pane ${pane==='OTHER'?'on':''}" data-pane="OTHER"><div class="ch"><span class="nm">K / DST</span></div><ul>`+
     D.pool.filter(p=>(p.p==='K'||p.p==='DST')&&!t.has(p.n)).slice(0,12).map(p=>`<li data-n="${esc(p.n)}"><span class="n">${esc(p.n)}</span><span class="tm">${p.p}</span><span class="e">${p.r}</span></li>`).join('')+'</ul></div>';
  h+='</div></div>';
  h+='<div class="hint">Tap a player to log him to whoever is on the clock. Everyone with the link sees the same board.</div></div>';
  root.innerHTML=h;
}

    +'<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">'
    +'<style id="css">'+css+'</style></head><body><div id="root"></div>'
    +'<script id="data" type="application/json">'+data+'<\/script>'
    +'<script id="state" type="application/json">'+JSON.stringify(state)+'<\/script>'
    +'<script id="app" type="text/plain">'+app+'<\/script>'
    +'<script>(function(){var d=document;window.DRAFT_DATA=JSON.parse(d.getElementById("data").textContent);'
    +'window.STATE=JSON.parse(d.getElementById("state").textContent);'
    +'(new Function(d.getElementById("app").textContent))()})();<\/script></body></html>';
}

async function commit(){
  if(!AR||busy)return; busy=true; render();
  try{ await AR.publish(buildDoc({picks:picks.map(n=>IDX[n])})); }
  catch(e){
    const c=(e&&e.code)||'';
    if(c==='conflict'){ /* another device published first; this view reloads to the winner */ }
    else if(c==='not_granted'||c==='not_writer'){ canWrite=false; }
    else { alert('That pick did not save. Check your connection and try again.'); picks.pop(); }
  }
  busy=false; render();
}

function pick(name){
  if(canWrite===false)return;
  const c=cur(); if(!c||!P[name]||taken().has(name))return;
  picks.push(name); render(); commit();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('#tabs button[data-p]'); if(b){pane=b.dataset.p;render();window.scrollTo({top:0});return}
  const li=e.target.closest('li[data-n]'); if(li){pick(li.dataset.n);return}
  const tr=e.target.closest('.trow[data-t]'); if(tr){viewing=tr.dataset.t;render();return}
  if(e.target.id==='undo'){if(picks.length){picks.pop();render();commit()}return}
  if(e.target.id==='reset'){if(confirm('Clear every logged pick for everyone?')){picks=[];render();commit()}return}
  const sg=document.getElementById('sugg'); if(sg&&!e.target.closest('#search')&&!e.target.closest('#sugg'))sg.hidden=true;
});

let si=0;
function matches(){const sb=document.getElementById('search');if(!sb)return[];
  const q=sb.value.trim().toLowerCase(); if(q.length<2)return[];
  const t=taken(); return D.pool.filter(p=>!t.has(p.n)&&p.n.toLowerCase().includes(q)).slice(0,9)}
function drawSugg(){const sg=document.getElementById('sugg'),m=matches();
  if(!m.length){sg.hidden=true;return} si=Math.min(si,m.length-1);
  sg.innerHTML=m.map((p,i)=>`<div class="${i===si?'sel':''}" data-n="${esc(p.n)}">${esc(p.n)} <span style="color:var(--dim2);font-size:11px">${p.p} ${p.t}</span><span class="e">${p.r}</span></div>`).join('');
  sg.hidden=false}
document.addEventListener('input',e=>{if(e.target.id==='search'){si=0;drawSugg()}});
document.addEventListener('keydown',e=>{if(e.target.id!=='search')return; const m=matches();
  if(e.key==='ArrowDown'){si=Math.min(si+1,m.length-1);drawSugg();e.preventDefault()}
  else if(e.key==='ArrowUp'){si=Math.max(si-1,0);drawSugg();e.preventDefault()}
  else if(e.key==='Enter'&&m[si]){pick(m[si].n);e.target.value='';document.getElementById('sugg').hidden=true;e.preventDefault()}
  else if(e.key==='Escape')document.getElementById('sugg').hidden=true});
document.addEventListener('click',e=>{const d=e.target.closest('#sugg div[data-n]');
  if(d){pick(d.dataset.n);const sb=document.getElementById('search');if(sb)sb.value='';document.getElementById('sugg').hidden=true}});

render();
(async()=>{ try{ AR=await claude.use('artifact'); canWrite=AR?null:false; }catch(e){ AR=null;canWrite=false } render(); })();
</script>
