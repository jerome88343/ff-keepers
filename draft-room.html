<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f13">
<title>F The Raiders Draft Room</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
:root{--bg:#0d0f13;--panel:#151a21;--panel2:#12161c;--line:#232a35;--line2:#1c222b;
 --tx:#e8ecf2;--dim:#8b97a8;--dim2:#5d6878;--a:#22d3ee;--b:#c084fc;--g:#34d399;--r:#f87171;--w:#fbbf24}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:14px;
 padding:10px calc(12px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
 touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.wrap{max-width:1720px;margin:0 auto}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--dim);font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--a);color:var(--tx)}
.btn.danger:hover{border-color:var(--r);color:var(--r)}
.spacer{margin-left:auto}

.clock{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#0d1f24;border:1px solid #1c4b56;border-radius:12px;padding:12px 18px;margin-bottom:11px;
 position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:40;backdrop-filter:blur(8px)}
.clock.mine{background:#1a1410;border-color:var(--w);box-shadow:0 0 0 1px var(--w) inset}
.clock .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800}
.clock .v{font-family:'Barlow Condensed',sans-serif;font-size:26px;line-height:1.05;color:var(--tx)}
.clock .v em{color:var(--a);font-style:normal}
.clock.mine .v em{color:var(--w)}
.clock .cell{display:flex;flex-direction:column;gap:1px}

#search{background:var(--panel2);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:16px;font-weight:600;padding:10px 13px;border-radius:9px;width:340px;max-width:100%}
#search:focus{outline:none;border-color:var(--a)}
.sugg{position:absolute;z-index:50;background:var(--panel);border:1px solid var(--a);border-radius:9px;margin-top:4px;min-width:340px;box-shadow:0 12px 34px #000a}
.sugg div{padding:8px 12px;cursor:pointer;font-size:13.5px;font-weight:700;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center}
.sugg div:first-child{border-top:none}
.sugg div:hover,.sugg div.sel{background:#0d1f24}
.sugg .e{margin-left:auto;color:var(--dim2);font-size:12px;font-weight:700}

.cols{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 280px;gap:10px;align-items:start}
.pp{font-size:8.5px;font-weight:800;letter-spacing:.06em;padding:2px 5px;border-radius:4px;flex-shrink:0;min-width:26px;text-align:center}
.pp.RB{background:#2a1520;color:#f9a8d4}.pp.WR{background:#12203a;color:#93c5fd}.pp.TE{background:#0d2420;color:#6ee7b7}
.mix{display:flex;gap:10px;font-size:11.5px;font-weight:800;align-items:center;flex-wrap:wrap}
.mix b{font-variant-numeric:tabular-nums;font-size:13px}
@media(max-width:1640px){.cols{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:1100px){.cols{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.cols{grid-template-columns:1fr;gap:8px}}

/* tab bar: phones + iPad portrait */
.tabs{display:none;gap:6px;overflow-x:auto;padding:2px 0 8px;position:sticky;top:calc(env(safe-area-inset-top) + 74px);z-index:39;background:var(--bg)}
.tabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);font:inherit;font-size:13px;font-weight:800;
 padding:10px 15px;border-radius:9px;min-height:44px;cursor:pointer;letter-spacing:.04em}
.tabs button.on{background:#0d1f24;border-color:var(--a);color:var(--a)}
@media(max-width:1100px){
  .tabs{display:flex}
  .side{display:contents}
  .pane{display:none}
  .pane.on{display:block}
  .cols{grid-template-columns:1fr}
}
/* fat touch targets on anything without a real pointer */
@media(hover:none){
  li{padding:11px 12px;font-size:14.5px;min-height:46px}
  li .n{font-size:14.5px}
  .trow{padding:12px 12px;font-size:13.5px;min-height:46px}
  .sugg div{padding:13px 14px;font-size:15px;min-height:48px}
  .btn{padding:10px 14px;min-height:44px;font-size:13px}
  li:hover,.trow:hover{background:inherit}
  li:active{background:#0d1f24}
  .trow:active{background:#0d1f24}
}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.ch .nm{font-family:'Barlow Condensed',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.ch .ct{margin-left:auto;font-size:11px;font-weight:800;color:var(--dim2)}
.warn{padding:7px 12px;font-size:11.5px;font-weight:800;line-height:1.45;border-bottom:1px solid var(--line2)}
.warn.hot{background:#2a1215;color:#fca5a5}
.warn.mid{background:#1c1710;color:var(--w)}
.warn.ok{background:#0d1f18;color:var(--g)}
ul{list-style:none}
li{display:flex;align-items:center;gap:7px;padding:6px 11px;border-top:1px solid var(--line2);cursor:pointer;font-size:13px}
li:first-child{border-top:none}
li:hover{background:#0d1f24}
li .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .tm{font-size:10.5px;font-weight:700;color:var(--dim2);flex-shrink:0}
li .e{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--dim2);font-variant-numeric:tabular-nums;flex-shrink:0}
li.tier{border-top:2px solid var(--r);position:relative}
.rk{font-size:8.5px;font-weight:800;letter-spacing:.05em;padding:1px 4px;border-radius:3px;flex-shrink:0}
.rk.r26{color:var(--w);background:#2a2110}
.rk.r25{color:var(--b);background:#231a38}
.cliff{padding:4px 11px;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--r);background:#1a1013;border-top:1px solid #3a1c22;border-bottom:1px solid #3a1c22}

.side{display:flex;flex-direction:column;gap:10px}
.rosters{}
.trow{padding:7px 11px;border-top:1px solid var(--line2);cursor:pointer;font-size:12.5px;font-weight:700;display:flex;gap:7px;align-items:center}
.trow:hover{background:#0d1f24}
.trow.on{background:#0d1f24;box-shadow:inset 3px 0 0 var(--a)}
.trow.me{color:var(--w)}
.trow .need{margin-left:auto;font-size:10px;font-weight:800;color:var(--dim2);letter-spacing:.04em}
.rost{padding:9px 11px;font-size:12px}
.rost h4{font-family:'Barlow Condensed',sans-serif;font-size:17px;text-transform:uppercase;margin-bottom:5px;color:var(--a)}
.rost .g{margin-bottom:7px}
.rost .gl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:800}
.rost .p{font-size:12.5px;font-weight:700;padding:2px 0;display:flex;gap:6px}
.rost .p .kk{font-size:9px;font-weight:800;color:var(--g);letter-spacing:.05em}
.rost .p .rr{margin-left:auto;color:var(--dim2);font-size:11px}
.rost .empty{color:var(--r);font-size:11.5px;font-weight:800}
.log{font-size:12px}
.log div{padding:5px 11px;border-top:1px solid var(--line2);display:flex;gap:7px}
.log .o{color:var(--dim2);font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0}
.log .t{color:var(--dim2);margin-left:auto;font-size:10.5px;font-weight:700;flex-shrink:0}
.log div.me{background:#1a1410}
.hint{font-size:11.5px;color:var(--dim2);font-weight:600;line-height:1.55;padding:8px 11px}
</style></head><body><div class="wrap">

<div class="top">
  <h1>Draft Room</h1>
  <div style="position:relative"><input id="search" placeholder="Type a player, Enter to assign to team on the clock" autocomplete="off"><div id="sugg" class="sugg" hidden></div></div>
  <span class="spacer"></span>
  <button class="btn" id="undo">Undo last pick</button>
  <button class="btn" id="sync">Sync code</button>
  <button class="btn danger" id="reset">Reset draft</button>
</div>

<div class="clock" id="clock"></div>
<div class="tabs" id="tabs">
  <button data-p="FLEX">Flex</button><button data-p="RB">RB</button><button data-p="WR">WR</button><button data-p="TE">TE</button>
  <button data-p="QB">QB</button><button data-p="OTHER">K / DST</button>
  <button data-p="TEAMS">Teams</button><button data-p="LOG">Log</button>
</div>
<div class="cols">
  <div class="col pane" data-pane="FLEX" id="cFLEX"></div>
  <div class="col pane" data-pane="QB" id="cQB"></div>
  <div class="col pane" data-pane="RB" id="cRB"></div>
  <div class="col pane" data-pane="WR" id="cWR"></div>
  <div class="col pane" data-pane="TE" id="cTE"></div>
  <div class="side">
    <div class="col pane" data-pane="TEAMS"><div class="ch"><span class="nm">Teams</span><span class="ct">tap to view</span></div><div class="rosters" id="teams"></div></div>
    <div class="col pane" data-pane="TEAMS"><div class="ch"><span class="nm" id="rostName">Roster</span></div><div class="rost" id="roster"></div></div>
    <div class="col pane" data-pane="LOG"><div class="ch"><span class="nm">Pick Log</span></div><div class="log" id="log"></div></div>
    <div class="col pane" data-pane="OTHER" id="cOTHER"></div>
  </div>
</div>
<div class="hint">Click any player to assign them to the team currently on the clock. Or type in the box and hit Enter. Everything saves in this browser, so a refresh will not lose the draft.</div>
</div>
<script src="draft-data.js"></script>
<script>
const D=DRAFT_DATA, ME=D.me, KEY='ftr2026draft';
const TEAM={}; D.teams.forEach(t=>TEAM[t.id]=t);
const P={}; D.pool.forEach(p=>P[p.n]=p);
const LIVE=D.draft.filter(s=>!s.keeper);
let picks=[]; try{picks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){picks=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(picks))}catch(e){}};
const taken=()=>new Set(picks.map(p=>p.n));
const cur=()=>LIVE[picks.length]||null;
const avail=pos=>{const t=taken();return D.pool.filter(p=>p.p===pos&&!t.has(p.n))};

function onClock(){const c=cur();return c&&c.tid===ME}
// gap that matters: if I'm up, how many picks until my NEXT one after this
function untilMe(){const from=picks.length+(onClock()?1:0);
  const i=LIVE.findIndex((s,ix)=>ix>=from&&s.tid===ME);return i<0?null:i-picks.length}

// how many of each position have gone in the last N picks
function rate(pos,win){const last=picks.slice(-win);if(!last.length)return null;
  return last.filter(x=>P[x.n]&&P[x.n].p===pos).length/last.length}

function tierBreak(list){ // biggest ECR gap inside the top 12 = the cliff
  let bi=-1,bg=0;
  for(let i=0;i<Math.min(list.length-1,11);i++){const g=list[i+1].r-list[i].r;if(g>bg){bg=g;bi=i}}
  return bg>=12?bi:-1;
}

function flexCol(){
  const t=taken();
  const list=D.pool.filter(p=>(p.p==='RB'||p.p==='WR'||p.p==='TE')&&!t.has(p.n));
  const top=list.slice(0,12),c={RB:0,WR:0,TE:0};top.forEach(p=>c[p.p]++);
  const tb=tierBreak(list);
  let h=`<div class="ch"><span class="nm">Flex</span><span class="ct">${list.length} left</span></div>`;
  h+=`<div class="warn ok"><div class="mix"><span style="color:var(--dim)">Next 12</span><span style="color:#f9a8d4">RB <b>${c.RB}</b></span><span style="color:#93c5fd">WR <b>${c.WR}</b></span><span style="color:#6ee7b7">TE <b>${c.TE}</b></span></div></div><ul>`;
  list.slice(0,30).forEach((p,i)=>{
    if(i===tb+1&&tb>=0)h+='<div class="cliff">tier drop</div>';
    const rk=p.rk===26?'<span class="rk r26">RK</span>':p.rk===25?'<span class="rk r25">2YR</span>':'';
    h+=`<li data-n="${p.n.replace(/"/g,'&quot;')}"><span class="pp ${p.p}">${p.p}</span><span class="n">${p.n}</span>${rk}<span class="tm">${p.t}</span><span class="e">${p.r}</span></li>`});
  return h+'</ul>'}

function posCol(pos){
  const list=avail(pos), u=untilMe(), r=rate(pos,10), rAll=rate(pos,999);
  const use = r===null?null:(r*0.65 + (rAll||0)*0.35);
  const exp = (u===null||use===null)?null:Math.round(u*use);
  const tb=tierBreak(list), inTier=tb<0?list.length:tb+1;
  const up=onClock();
  let w='',cls='ok';
  if(exp!==null&&u!==null){
    const lead=up?`If you pass now, about ${exp}`:`About ${exp}`;
    const tail=up?'before you pick again':'before your next pick';
    if(tb>=0&&exp>=inTier){cls='hot';w=`${up?'TAKE ONE NOW. ':'RUN RISK. '}${lead} ${pos}s go ${tail} and only ${inTier} sit above the cliff.`}
    else if(tb>=0&&exp>=inTier-2){cls='mid';w=`Tight. ${lead} ${pos}s go ${tail}, ${inTier} left in this tier.`}
    else{cls='ok';w=`${lead} ${pos}s go ${tail}. ${inTier} in the top tier.`}
  } else w=`${list.length} available.`;
  let h=`<div class="ch"><span class="nm">${pos}</span><span class="ct">${list.length} left</span></div>`;
  h+=`<div class="warn ${cls}">${w}</div><ul>`;
  list.slice(0,26).forEach((p,i)=>{
    if(i===tb+1&&tb>=0)h+=`<div class="cliff">tier drop</div>`;
    const rk=p.rk===26?'<span class="rk r26">RK</span>':p.rk===25?'<span class="rk r25">2YR</span>':'';
    h+=`<li data-n="${p.n.replace(/"/g,'&quot;')}"><span class="n">${p.n}</span>${rk}<span class="tm">${p.t}</span><span class="e">${p.r}</span></li>`;
  });
  return h+'</ul>';
}

function otherCol(){
  const t=taken(); let h=`<div class="ch"><span class="nm">K / DST</span></div><ul>`;
  D.pool.filter(p=>(p.p==='K'||p.p==='DST')&&!t.has(p.n)).slice(0,12).forEach(p=>{
    h+=`<li data-n="${p.n.replace(/"/g,'&quot;')}"><span class="n">${p.n}</span><span class="tm">${p.p}</span><span class="e">${p.r}</span></li>`});
  return h+'</ul>';
}

function rosterOf(tid){
  const t=TEAM[tid], out={QB:[],RB:[],WR:[],TE:[],K:[],DST:[]};
  t.k.forEach(k=>out[k.p]&&out[k.p].push({n:k.n,r:'R'+k.r,keep:true}));
  picks.filter(p=>p.tid===tid).forEach(p=>{const pl=P[p.n];if(pl&&out[pl.p])out[pl.p].push({n:p.n,r:'R'+p.r,keep:false})});
  return out;
}
function needs(tid){const r=rosterOf(tid);const n=[];
  if(r.QB.length<1)n.push('QB'); if(r.RB.length<3)n.push('RB'); if(r.WR.length<3)n.push('WR'); if(r.TE.length<1)n.push('TE');
  return n}

let viewing=ME;
function render(){
  const c=cur();
  const cl=document.getElementById('clock');
  if(!c){cl.className='clock';cl.innerHTML='<div class="cell"><div class="k">Draft complete</div><div class="v">All 144 picks are in.</div></div>'}
  else{
    const u=untilMe(), mine=c.tid===ME;
    cl.className='clock'+(mine?' mine':'');
    cl.innerHTML=`<div class="cell"><div class="k">On the clock</div><div class="v"><em>${TEAM[c.tid].name}</em></div></div>
      <div class="cell"><div class="k">Pick</div><div class="v">#${c.ovr} &middot; R${c.r}</div></div>
      <div class="cell"><div class="k">Selections made</div><div class="v">${picks.length} / 144</div></div>
      <div class="cell"><div class="k">Your next pick</div><div class="v">${mine?'<em>YOU ARE UP</em>':(u===null?'none left':'in '+u+' pick'+(u===1?'':'s'))}</div></div>
      <div class="cell"><div class="k">They still need</div><div class="v" style="font-size:19px">${needs(c.tid).join(' ')||'nothing'}</div></div>`;
  }
  ['QB','RB','WR','TE'].forEach(p=>document.getElementById('c'+p).innerHTML=posCol(p));
  document.getElementById('cFLEX').innerHTML=flexCol();
  document.getElementById('cOTHER').innerHTML=otherCol();

  document.getElementById('teams').innerHTML=D.teams.slice().sort((a,b)=>a.slot-b.slot).map(t=>
    `<div class="trow ${viewing===t.id?'on':''} ${t.id===ME?'me':''}" data-t="${t.id}">${t.slot}. ${t.name}<span class="need">${needs(t.id).join(' ')||'set'}</span></div>`).join('');

  const r=rosterOf(viewing);
  document.getElementById('rostName').textContent=TEAM[viewing].owner;
  document.getElementById('roster').innerHTML=['QB','RB','WR','TE','K','DST'].map(pos=>{
    const l=r[pos]; if(!l.length)return `<div class="g"><div class="gl">${pos}</div><div class="empty">none</div></div>`;
    return `<div class="g"><div class="gl">${pos}</div>`+l.map(x=>`<div class="p">${x.n}${x.keep?'<span class="kk">K</span>':''}<span class="rr">${x.r}</span></div>`).join('')+'</div>';
  }).join('');

  document.getElementById('log').innerHTML=picks.slice().reverse().slice(0,14).map(p=>
    `<div class="${p.tid===ME?'me':''}"><span class="o">#${p.ovr}</span>${p.n}<span class="t">${TEAM[p.tid].name.slice(0,16)}</span></div>`).join('')||'<div class="hint">No picks entered yet.</div>';
  save();
}

function pick(name){
  const c=cur(); if(!c||!P[name]||taken().has(name))return;
  picks.push({n:name,tid:c.tid,ovr:c.ovr,r:c.r}); render();
  document.getElementById('search').value=''; document.getElementById('sugg').hidden=true;
}
document.addEventListener('click',e=>{
  const li=e.target.closest('li[data-n]'); if(li){pick(li.dataset.n);return}
  const tr=e.target.closest('.trow'); if(tr){viewing=tr.dataset.t;render();return}
  if(!e.target.closest('#search'))document.getElementById('sugg').hidden=true;
});
document.getElementById('undo').onclick=()=>{picks.pop();render()};
document.getElementById('reset').onclick=()=>{if(confirm('Clear every entered pick?')){picks=[];render()}};

const sb=document.getElementById('search'), sg=document.getElementById('sugg');
let si=0;
function matches(){const q=sb.value.trim().toLowerCase(); if(q.length<2)return [];
  const t=taken(); return D.pool.filter(p=>!t.has(p.n)&&p.n.toLowerCase().includes(q)).slice(0,9)}
function drawSugg(){const m=matches(); if(!m.length){sg.hidden=true;return}
  si=Math.min(si,m.length-1);
  sg.innerHTML=m.map((p,i)=>`<div class="${i===si?'sel':''}" data-n="${p.n.replace(/"/g,'&quot;')}">${p.n} <span style="color:var(--dim2);font-size:11px">${p.p} ${p.t}</span><span class="e">${p.r}</span></div>`).join('');
  sg.hidden=false}
sb.oninput=()=>{si=0;drawSugg()};
sb.onkeydown=e=>{const m=matches();
  if(e.key==='ArrowDown'){si=Math.min(si+1,m.length-1);drawSugg();e.preventDefault()}
  else if(e.key==='ArrowUp'){si=Math.max(si-1,0);drawSugg();e.preventDefault()}
  else if(e.key==='Enter'&&m[si]){pick(m[si].n);e.preventDefault()}
  else if(e.key==='Escape'){sg.hidden=true}};
sg.addEventListener('click',e=>{const d=e.target.closest('div[data-n]');if(d)pick(d.dataset.n)});

// ---- pane switching (phone / iPad portrait) ----
let pane=localStorage.getItem(KEY+'pane')||'FLEX';
function paint(){document.querySelectorAll('.pane').forEach(e=>e.classList.toggle('on',e.dataset.pane===pane));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===pane));}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');
  if(b){pane=b.dataset.p;try{localStorage.setItem(KEY+'pane',pane)}catch(_){}paint();window.scrollTo({top:0})}});

// ---- cross-device sync: picks are sequential, so the ordered player list is the whole state ----
const IDX={}; D.pool.forEach((p,i)=>IDX[p.n]=i);
function encode(){return picks.map(p=>IDX[p.n].toString(36)).join('.')}
function decode(code){picks=[];const ids=code.trim().split('.').filter(Boolean);
  for(const id of ids){const pl=D.pool[parseInt(id,36)];const c=cur();if(!pl||!c)break;
    picks.push({n:pl.n,tid:c.tid,ovr:c.ovr,r:c.r})}render()}
document.getElementById('sync').onclick=()=>{
  const code=encode();
  const inp=prompt(`Copy this to your other device, or paste that device's code here and hit OK.\n\n${picks.length} picks entered.`,code);
