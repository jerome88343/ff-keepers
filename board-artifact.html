<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0f13; --panel:#151a21; --panel2:#12161c; --line:#232a35; --line2:#1c222b;
  --tx:#e8ecf2; --dim:#8b97a8; --dim2:#5d6878; --accent:#22d3ee;
  --QB:#f87171; --RB:#34d399; --WR:#60a5fa; --TE:#c084fc; --PK:#f472b6; --DEF:#94a3b8;

body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;padding:26px 22px 70px;-webkit-text-size-adjust:100%}
.wrap{max-width:1560px;margin:0 auto}
.eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(34px,6vw,60px);line-height:1;text-transform:uppercase;margin:2px 0 6px}
.sub{color:var(--dim);font-size:15px;font-weight:600}
.sub b{color:var(--tx)}
h2{font-family:'Barlow Condensed',sans-serif;font-size:27px;text-transform:uppercase;letter-spacing:.05em;margin:34px 0 12px;color:var(--tx);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
h2 .note{font-family:Inter,sans-serif;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--dim)}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:#2b2233;color:#e0b3ff;border:1px solid #4b3a5c}
.mocklink{display:inline-block;float:right;font-size:13px;font-weight:800;letter-spacing:.03em;color:var(--accent);text-decoration:none;background:#0d1f24;border:1px solid #1c4b56;padding:7px 13px;border-radius:8px;margin-top:-4px}
.mocklink:hover{background:#123039}
/* POT */
.pot{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px 22px;margin-top:20px}
.potgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.pcell{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:13px 15px}
.pcell .k{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:700}
.pcell .v{font-size:30px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.pcell .m{font-size:12px;color:var(--dim2);font-weight:600;margin-top:2px}
.pcell.tot{background:#0d1f24;border-color:#1c4b56}
.pcell.tot .v{color:var(--accent)}
/* TABLES */
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:13px;overflow:hidden;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:11px 12px;text-align:left;background:var(--panel2);border-bottom:1px solid var(--line)}
td{padding:11px 12px;font-size:14px;border-top:1px solid var(--line2);font-weight:600}
td.r,th.r{text-align:right}
.muted{color:var(--dim2);font-weight:600}
.slotnum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:#1e2733;font-size:13px;font-weight:800;color:var(--tx)}
.open{color:var(--dim2);font-style:italic;font-weight:600}
.moneyscroll{overflow-x:auto;border-radius:13px}
#money{min-width:820px}
#money td.c,#money th.c{text-align:center}
.yes{color:#34d399;font-weight:800;font-size:12px;letter-spacing:.05em}
.due{color:#fbbf24;font-weight:800;font-size:12px;letter-spacing:.05em}
.cred{color:#34d399;font-weight:800}
.sm{font-size:11px;color:var(--dim2);font-weight:700}
#money tr.tot td{background:var(--panel2);border-top:2px solid var(--line);color:var(--dim);font-size:13px}
#money tr.tot td b{color:var(--tx);font-size:15px}
/* readable table columns — stop the sprawl on wide screens */
#orderwrap table{table-layout:fixed}
#orderwrap table{max-width:1000px}
#money{max-width:1240px}
#orderwrap th:nth-child(1),#orderwrap td:nth-child(1){width:74px}
#orderwrap th:nth-child(2),#orderwrap td:nth-child(2){width:40%}
#orderwrap th:nth-child(3),#orderwrap td:nth-child(3){width:38%}
#orderwrap th:nth-child(4),#orderwrap td:nth-child(4){width:96px;text-align:center}
#money th:nth-child(1),#money td:nth-child(1){width:24%}
#money th:nth-child(2),#money td:nth-child(2){width:20%}
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:rgba(255,255,255,.014)}
#orderwrap tr:hover td,#money tr:hover td{background:rgba(34,211,238,.05)}
#money tr.tot:hover td{background:var(--panel2)}
/* keeper cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.card .tn{font-family:'Barlow Condensed',sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.card .ow{font-size:11px;color:var(--dim);font-weight:700}

.pos{font-size:10px;font-weight:800;padding:3px 6px;border-radius:5px;min-width:34px;text-align:center;letter-spacing:.04em;color:#0d0f13}
.kn{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr{font-size:12px;font-weight:800;color:var(--dim);white-space:nowrap}
.tax{font-size:10px;font-weight:800;color:#fca5a5;background:#2a1618;border:1px solid #5a2a2e;padding:2px 6px;border-radius:5px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:13px;padding:26px;text-align:center;color:var(--dim2);font-weight:600;font-size:14px}

<script>
const POS=['QB','RB','WR','TE','PK','DEF'];
const posColor=p=>getComputedStyle(document.documentElement).getPropertyValue('--'+(POS.includes(p)?p:'DEF')).trim();
const money=n=>'$'+n.toLocaleString('en-US');
const T=DATA.teams, N=DATA.teamCount, R=DATA.rounds;

document.getElementById('season').textContent=DATA.season;
document.getElementById('ddate').textContent=DATA.draftDate;
document.getElementById('upd').textContent=DATA.updated;

// ---------- POT ----------
const tax=r=>DATA.taxLadder[Math.min(r,8)]||DATA.taxLadder[8];
const taxRd=k=>(DATA.taxAtOrigin && k.origin) ? k.origin : k.round;
const taxFor=t=>(t.keepers||[]).filter(k=>k.bumped).reduce((s,k)=>s+tax(taxRd(k)),0);
const insFor=t=>(t.insurance?DATA.insuranceFee:0);
const creditFor=t=>(t.carryover||0);
const owedFor=t=>DATA.buyIn + taxFor(t) + insFor(t) - creditFor(t);

const declaredCt=T.filter(t=>(t.keepers||[]).length>0).length;
const paidCt=T.filter(t=>t.paid).length;
let bumpCt=0,taxTotal=0;
T.forEach(t=>(t.keepers||[]).forEach(k=>{if(k.bumped){bumpCt++;taxTotal+=tax(taxRd(k));}}));
const insCt=T.filter(t=>t.insurance).length, insTotal=insCt*DATA.insuranceFee;

const declaredT = T.filter(t=>(t.keepers||[]).length>0);
const gross     = declaredT.reduce((s,t)=>s+DATA.buyIn+taxFor(t)+insFor(t),0); // before credit
const holdbackIn= declaredT.reduce((s,t)=>s+creditFor(t),0);                   // already in hand
const cashIn    = T.filter(t=>t.paid).reduce((s,t)=>s+owedFor(t),0);
const committed = gross;
const collected = holdbackIn + cashIn;
const projected = N*DATA.buyIn + taxTotal + insTotal;
const outstanding = committed - collected;
const withK2     = declaredT;
const credTotal  = withK2.reduce((s,t)=>s+creditFor(t),0);          // declared only, matches the rows
const dueAtDraft = withK2.filter(t=>!t.paid).reduce((s,t)=>s+owedFor(t),0);

document.getElementById('declared').textContent=declaredCt+' of '+N+' teams have declared keepers';
document.getElementById('ratesbadge').innerHTML=DATA.ratesPending?'<span class="badge">Rates pending league vote</span>':'';
document.getElementById('potgrid').innerHTML=[
 ['Projected Pot',money(projected),'All money. '+N+' teams @ '+money(DATA.buyIn)+' plus fees',true],
 ['Committed',money(committed),declaredCt+' of '+N+' declared · full value, holdback not deducted'],
 ['Already In Hand',money(collected),money(holdbackIn)+' held back from 2025'+(cashIn?' + '+money(cashIn)+' cash':'')],
 ['Due At The Draft',money(dueAtDraft),'cash to collect from declared teams'],
 ['Luxury Tax',money(taxTotal),bumpCt+' bump'+(bumpCt===1?'':'s')+' across '+T.filter(t=>(t.keepers||[]).some(k=>k.bumped)).length+' team'+(T.filter(t=>(t.keepers||[]).some(k=>k.bumped)).length===1?'':'s')],
 ['Keeper Insurance',money(insTotal),insCt+' team'+(insCt===1?'':'s')+' @ '+money(DATA.insuranceFee)]
].map(c=>'<div class="pcell'+(c[3]?' tot':'')+'"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div><div class="m">'+c[2]+'</div></div>').join('');

const byId={}; T.forEach(t=>byId[t.id]=t);
const order=(DATA.slotPickOrder||[]).map(id=>byId[id]).filter(Boolean);
const onClockTeam=order.find(t=>!t.slot);

// ---------- DRAFT ORDER ----------
const byslot={}; T.forEach(t=>{if(t.slot)byslot[t.slot]=t;});
const chosen=Object.keys(byslot).length;
document.getElementById('ordernote').textContent=chosen+' of '+N+' slots claimed';
let oh='<table><tr><th style="width:70px">Slot</th><th>Team</th><th>Owner</th><th class="r">Keepers</th></tr>';
for(let s=1;s<=N;s++){const t=byslot[s];
 oh+='<tr><td><span class="slotnum">'+s+'</span></td>'+
   (t?'<td>'+t.name+'</td><td class="muted">'+(t.owner||'')+'</td><td class="r">'+((t.keepers||[]).length||'<span class="muted">0</span>')+'</td>'
     :'<td colspan="3" class="open">open</td>')+'</tr>';}
document.getElementById('orderwrap').innerHTML=oh+'</table>';

// ---------- MONEY ----------
document.getElementById('moneynote').textContent=
  money(dueAtDraft)+' to collect at the draft · holdback already counts toward the pot';
let mh='<tr><th>Team</th><th>Owner</th><th class="r">Buy-in</th><th class="r">Luxury Tax</th>'+
       '<th class="c">Insurance</th><th class="r">Carryover</th><th class="r">Owes</th><th class="c">Paid</th></tr>';
withK2.forEach(t=>{
  const cr=creditFor(t), tx=taxFor(t), nb=(t.keepers||[]).filter(k=>k.bumped).length;
  mh+='<tr><td>'+t.name+'</td><td class="muted">'+t.owner+'</td>'+
   '<td class="r">'+money(DATA.buyIn)+'</td>'+
   '<td class="r">'+(tx?money(tx)+' <span class="sm">('+nb+')</span>':'<span class="muted">—</span>')+'</td>'+
   '<td class="c">'+(t.insurance?'<span class="yes">YES</span>':'<span class="muted">no</span>')+'</td>'+
   '<td class="r">'+(cr?'<span class="cred">-'+money(cr)+'</span>':'<span class="muted">—</span>')+'</td>'+
   '<td class="r"><b>'+money(owedFor(t))+'</b></td>'+
   '<td class="c">'+(t.paid?'<span class="yes">PAID</span>':'<span class="due">DUE</span>')+'</td></tr>';});
const waiting=T.filter(t=>!(t.keepers||[]).length).length;
mh+='<tr class="tot"><td colspan="2">'+withK2.length+' of '+N+' declared'+
    (waiting?' · '+waiting+' still out':'')+'</td>'+
    '<td class="r">'+money(withK2.length*DATA.buyIn)+'</td>'+
    '<td class="r">'+money(taxTotal)+'</td><td class="c">'+insCt+'</td>'+
    '<td class="r">'+(credTotal?'<span class="cred">-'+money(credTotal)+'</span>':'—')+'</td>'+
    '<td class="r"><b>'+money(dueAtDraft)+'</b></td><td class="c">'+paidCt+'/'+N+'</td></tr>';
document.getElementById('money').innerHTML=mh;

// ---------- CARDS ----------
const withK=T.filter(t=>(t.keepers||[]).length>0);
if(!withK.length){
  document.getElementById('cards').innerHTML='<div class="empty">No keepers declared yet. They land here as owners post them.</div>';
}else{
  document.getElementById('cards').className='cards';
  document.getElementById('cards').innerHTML=withK.map(t=>{
    const ks=[...t.keepers].sort((a,b)=>a.round-b.round);
    const owed=owedFor(t);
    return '<div class="card"><div class="ch"><span class="tn">'+t.name+'</span><span class="ow">'+
      (t.slot?'Slot '+t.slot+' · ':'')+(t.owner||'')+'</span></div>'+
      ks.map(k=>'<div class="krow"><span class="pos" style="background:'+posColor(k.pos)+'">'+k.pos+'</span>'+
        '<span class="kn">'+k.player+'</span>'+
        (k.bumped?'<span class="tax">+$'+tax(taxRd(k))+'</span>':'')+
        '<span class="kr">R'+k.round+'</span></div>').join('')+
      '<div class="krow" style="border-top:1px solid var(--line);margin-top:4px"><span class="kn muted" style="font-size:12px">Owes at draft</span>'+
      '<span class="kr" style="color:var(--tx);font-size:14px">'+money(owed)+'</span></div></div>';
  }).join('');
}
document.getElementById('foot').innerHTML=
 'Max 4 keepers &nbsp;&#183;&nbsp; max 3 WR, max 2 every other position &nbsp;·&nbsp; max 2 at a discounted round &nbsp;·&nbsp; one keeper per round<br>'+
 'Luxury tax is charged each time a keeper is bumped back a round. Keeper insurance ('+money(DATA.insuranceFee)+') must be declared on keeper day.';
</script>
