<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F The Raiders Mock Draft</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f13;--panel:#151a21;--panel2:#12161c;--line:#232a35;--line2:#1c222b;
 --tx:#e8ecf2;--dim:#8b97a8;--dim2:#5d6878;--accent:#22d3ee;
 --QB:#f87171;--RB:#34d399;--WR:#60a5fa;--TE:#c084fc;--K:#f472b6;--PK:#f472b6;--DST:#94a3b8;--DEF:#94a3b8}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;padding:20px 18px 40px}
.wrap{max-width:1720px;margin:0 auto}
.eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:17px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(30px,5vw,50px);line-height:1;text-transform:uppercase;margin:2px 0 4px}
.sub{color:var(--dim);font-size:14px;font-weight:600;margin-bottom:16px}
.sub b{color:var(--tx)}
.clockbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#0d1f24;border:1px solid #1c4b56;border-radius:13px;padding:13px 18px;margin-bottom:16px}
.clockbar .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}
.clockbar .who{font-family:'Barlow Condensed',sans-serif;font-size:27px;text-transform:uppercase;letter-spacing:.02em}
.clockbar .pk{font-size:13px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.btns{margin-left:auto;display:flex;gap:8px}
button{font-family:Inter,sans-serif;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
 padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--tx);cursor:pointer}
button:hover{background:#1c2430;border-color:#313d4d}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.warn:hover{background:#2a1618;border-color:#5a2a2e;color:#fca5a5}
.grid{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
@media(max-width:1200px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px}
h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.05em;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
h2 .note{font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--dim);margin-left:auto}
.boardscroll{overflow:auto;max-height:74vh;border-radius:0 0 13px 13px}
table.board{border-collapse:collapse;min-width:1180px;width:100%}
table.board th{position:sticky;top:0;z-index:3;background:var(--panel2);text-align:center;padding:7px 4px;font-size:10px;border-bottom:1px solid var(--line)}
table.board th .sl{display:block;font-size:14px;font-weight:800;color:var(--tx)}
table.board th .tm{display:block;font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
table.board td{border:1px solid var(--line2);height:42px;text-align:center;padding:0;vertical-align:middle}
td.rd{position:sticky;left:0;z-index:2;background:var(--panel2);font-size:11px;color:var(--dim);font-weight:800;width:44px;min-width:44px}
.cell{display:flex;flex-direction:column;justify-content:center;height:100%;padding:3px 5px;gap:1px}
.cell .no{font-size:8.5px;color:#465065;font-weight:700}
.cell .nm{font-size:11.5px;font-weight:800;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .mt{font-size:8.5px;color:var(--dim2);font-weight:700}
td.keep{background:#12171f}
td.keep .nm{font-style:normal}
td.picked{background:#111820}
td.now{background:#0d1f24;box-shadow:inset 0 0 0 2px var(--accent)}
td.now .no{color:var(--accent)}
td.tradedcell .no{color:#8a5158}
.tradetag{font-size:8px;font-weight:800;color:#8a5158;letter-spacing:.04em;text-transform:uppercase}
/* pool */
.tools{display:flex;gap:7px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
input[type=search]{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
 color:var(--tx);font-family:Inter,sans-serif;font-size:13px;font-weight:600;padding:8px 11px}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.pos-f{display:flex;gap:5px;flex-wrap:wrap;padding:0 14px 12px}
.pf{font-size:11px;font-weight:800;letter-spacing:.05em;padding:5px 9px;border-radius:99px;border:1px solid var(--line2);
 background:var(--panel2);color:var(--dim);cursor:pointer;text-transform:uppercase}
.pf.on{background:#0d1f24;border-color:#1c4b56;color:var(--accent)}
.poollist{max-height:62vh;overflow-y:auto}
.prow{display:flex;align-items:center;gap:9px;padding:8px 14px;border-top:1px solid var(--line2);cursor:pointer}
.prow:hover{background:#0d1f24}
.prow .rk{font-size:10.5px;color:var(--dim2);font-weight:800;width:30px;text-align:right;font-variant-numeric:tabular-nums}
.prow .pos{font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:4px;color:#0d0f13;min-width:32px;text-align:center}
.prow .nm{font-size:13.5px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tm{font-size:10.5px;color:var(--dim2);font-weight:700}
.done{padding:26px;text-align:center;color:var(--dim);font-weight:700}
.foot{margin-top:20px;color:var(--dim2);font-size:12px;font-weight:600;text-align:center;line-height:1.7}
</style></head><body><div class="wrap">
<div class="eyebrow">F The Raiders &nbsp;·&nbsp; 2026</div>
<h1>Mock Draft</h1>
<div class="sub">Real draft order, real keepers already locked in, real traded picks. Click a player to draft him.</div>

<div class="clockbar">
  <div><div class="lbl">On the clock</div><div class="who" id="who">—</div></div>
  <div class="pk" id="pkinfo"></div>
  <div class="btns">
    <button id="undo">Undo</button>
    <button id="reset" class="warn">Start over</button>
  </div>
</div>

<div class="grid">
  <div class="panel">
    <h2>The Board <span class="note" id="bnote"></span></h2>
    <div class="boardscroll"><table class="board" id="board"></table></div>
  </div>
  <div class="panel">
    <h2>Available <span class="note" id="pnote"></span></h2>
    <div class="tools"><input type="search" id="q" placeholder="Search a player..." autocomplete="off"></div>
    <div class="pos-f" id="posf"></div>
    <div class="poollist" id="pool"></div>
  </div>
</div>
<div class="foot" id="foot"></div>
</div>
<script src="data.js"></script>
<script src="trades.js"></script>
<script src="pool.js"></script>
<script>
const N=12,R=16,KEY='ftr-mock-2026';
const col=p=>getComputedStyle(document.documentElement).getPropertyValue('--'+p).trim()||'#94a3b8';
const bySlot={}; DATA.teams.forEach(t=>{if(t.slot)bySlot[t.slot]=t;});
const byId={};  DATA.teams.forEach(t=>byId[t.id]=t);

// who actually makes each pick, after trades
function ownerOf(rd,slot){
  const tr=TRADES.find(x=>x.rd===rd&&x.fromSlot===slot);
  return tr?byId[tr.to]:bySlot[slot];
}
// build all 192 picks in snake order
const PICKS=[];
for(let r=1;r<=R;r++){
  const slots=r%2===1?[...Array(N)].map((_,i)=>i+1):[...Array(N)].map((_,i)=>N-i);
  slots.forEach(s=>PICKS.push({rd:r,slot:s,owner:ownerOf(r,s),label:r+'.'+String(r%2===1?s:N-s+1).padStart(2,'0'),
    traded:!!TRADES.find(x=>x.rd===r&&x.fromSlot===s)}));
}
PICKS.forEach((p,i)=>p.no=i+1);

// drop keepers onto their team's own pick in that round (or an acquired one if their own is gone)
DATA.teams.forEach(t=>(t.keepers||[]).forEach(k=>{
  const mine=PICKS.filter(p=>p.rd===k.round&&p.owner&&p.owner.id===t.id&&!p.keeper);
  const own=mine.find(p=>p.slot===t.slot)||mine[0];
  if(own) own.keeper=k;
}));

let made=[];
try{ made=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ made=[]; }
let filter='ALL', query='';

const drafted=()=>new Set(made.map(m=>m.n));
const openPicks=()=>PICKS.filter(p=>!p.keeper);
const current=()=>openPicks()[made.length]||null;

function render(){
  const cur=current(), dr=drafted();
  // clock
  document.getElementById('who').textContent = cur? (cur.owner?cur.owner.name:'—') : 'Draft complete';
  document.getElementById('pkinfo').innerHTML = cur
    ? 'pick <b style="color:var(--tx)">'+cur.label+'</b> &nbsp;·&nbsp; overall '+cur.no+' &nbsp;·&nbsp; round '+cur.rd
      + (cur.traded? ' &nbsp;·&nbsp; <span style="color:#8a5158">traded pick</span>':'')
    : made.length+' picks made';
  document.getElementById('bnote').textContent=made.length+' drafted · '+openPicks().length+' open picks';

  // board
  let h='<tr><th></th>';
  for(let s=1;s<=N;s++){const t=bySlot[s];h+='<th><span class="sl">'+s+'</span><span class="tm">'+(t?t.name:'—')+'</span></th>';}
  h+='</tr>';
  for(let r=1;r<=R;r++){
    h+='<tr><td class="rd">R'+r+'</td>';
    for(let s=1;s<=N;s++){
      const p=PICKS.find(x=>x.rd===r&&x.slot===s);
      const pick=made.find(m=>m.no===p.no);
      let cls='',inner='<span class="no">'+p.label+'</span>';
      if(p.keeper){ cls='keep';
        inner+='<span class="nm" style="color:'+col(p.keeper.pos)+'">'+p.keeper.player+'</span><span class="mt">KEEPER</span>'; }
      else if(pick){ cls='picked';
        inner+='<span class="nm" style="color:'+col(pick.p)+'">'+pick.n+'</span><span class="mt">'+pick.p+' · '+pick.t+'</span>'; }
      else if(cur&&cur.no===p.no){ cls='now'; inner+='<span class="mt" style="color:var(--accent)">ON THE CLOCK</span>'; }
      else if(p.traded){ cls='tradedcell'; inner+='<span class="tradetag">'+(p.owner?p.owner.owner.split(' ')[0]:'')+'</span>'; }
      h+='<td class="'+cls+'"><div class="cell">'+inner+'</div></td>';
    }
    h+='</tr>';
  }
  document.getElementById('board').innerHTML=h;

  // pool
  const list=POOL.filter(x=>!dr.has(x.n))
    .filter(x=>filter==='ALL'||x.p===filter)
    .filter(x=>!query||x.n.toLowerCase().includes(query));
  document.getElementById('pnote').textContent=list.length+' left';
  document.getElementById('pool').innerHTML = !cur
    ? '<div class="done">Draft complete.</div>'
    : list.slice(0,300).map(x=>'<div class="prow" data-n="'+x.n.replace(/"/g,'&quot;')+'">'+
        '<span class="rk">'+x.r+'</span>'+
        '<span class="pos" style="background:'+col(x.p)+'">'+x.p+'</span>'+
        '<span class="nm">'+x.n+'</span><span class="tm">'+x.t+'</span></div>').join('');

  const poss=['ALL',...[...new Set(POOL.map(x=>x.p))]];
  document.getElementById('posf').innerHTML=poss.map(p=>
    '<span class="pf'+(filter===p?' on':'')+'" data-p="'+p+'">'+p+'</span>').join('');
  document.getElementById('foot').textContent=
    'Nothing here changes the real league. Your board is saved in this browser only.';
}

document.getElementById('pool').addEventListener('click',e=>{
  const row=e.target.closest('.prow'); if(!row) return;
  const cur=current(); if(!cur) return;
  const pl=POOL.find(x=>x.n===row.dataset.n); if(!pl) return;
  made.push({no:cur.no,n:pl.n,p:pl.p,t:pl.t});
  localStorage.setItem(KEY,JSON.stringify(made)); render();
});
document.getElementById('posf').addEventListener('click',e=>{
  if(!e.target.dataset.p) return; filter=e.target.dataset.p; render();
});
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.toLowerCase().trim(); render(); });
document.getElementById('undo').addEventListener('click',()=>{
  made.pop(); localStorage.setItem(KEY,JSON.stringify(made)); render();
});
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('Clear every pick you have made and start over?')){ made=[]; localStorage.setItem(KEY,'[]'); render(); }
});
render();
</script></body></html>
